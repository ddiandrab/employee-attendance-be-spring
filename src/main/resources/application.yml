spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_attendance
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
app:
  jwt:
    secret: ${JWT_SECRET:employee-service-development-jwt-secret-key-123456789}
    expiration: 3600000
server:
  port: 8080